name: Cyber Custom OS CI/CD Build & Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil

    - name: Make Scripts Executable
      run: |
        chmod +x build_iso.sh || true
        chmod +x install.sh || true
        chmod +x tests/*.sh || true

    - name: Test Shell Scripts Syntax
      run: |
        bash -n build_iso.sh
        bash -n install.sh

    - name: Run Test Suite
      run: |
        if [ -f tests/test_modules.sh ]; then
          bash tests/test_modules.sh
        else
          echo "No test_modules.sh found, skipping execution test."
        fi