name: Cyber Custom OS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install psutil

    - name: Set Script Execution Permissions
      run: |
        chmod +x tests/test_modules.sh
        chmod +x build_iso.sh
        chmod +x install.sh

    - name: Run Test Suite
      run: |
        bash tests/test_modules.sh

    - name: Validate Shell Scripts Syntax
      run: |
        bash -n build_iso.sh
        bash -n install.sh